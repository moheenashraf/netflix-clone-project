{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center my-5">
  <div class="col-md-5">
    <div class="glass-card">
      <div class="text-center mb-4">
        <i class="fa-solid fa-film fa-3x text-danger mb-2"></i>
        <h3 class="fw-bold">Sign In to MovieFlix</h3>
        <p class="text-muted small">Enter your email and password to access your dashboard</p>
      </div>

      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label class="form-label text-muted">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" name="email" class="form-control" placeholder="user@example.com" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-muted">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-lock"></i></span>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <a href="{{ url_for('forgot_password') }}" class="text-danger small text-decoration-none">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-cinema-red w-100 py-2"><i class="fa-solid fa-right-to-bracket me-2"></i> Sign In</button>
      </form>

      <div class="text-center mt-4 pt-3 border-top border-secondary">
        <p class="text-muted mb-0 small">Don't have an account? <a href="{{ url_for('signup') }}" class="text-danger fw-bold text-decoration-none">Sign Up</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
