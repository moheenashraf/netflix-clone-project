{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="app-card">
      <h3 class="mb-4">Edit Your Profile</h3>
      <form method="post" action="/edit-profile" enctype="multipart/form-data">

        <div class="mb-3 text-center">
         <img id="photoPreview"
     src="{{ url_for('static', filename=profile.profile_photo_url) if profile.profile_photo_url else 'https://placehold.co/120x120/1a1a1a/ffffff?text=Photo' }}"
     alt="Profile Photo"
     style="width:110px; height:110px; object-fit:cover; border-radius:50%; border:2px solid #444;">
          <div class="mt-2">
            <label for="photoInput" class="btn btn-outline-light btn-sm">Change Profile Photo</label>
            <input type="file" id="photoInput" name="profile_photo" accept=".png,.jpg,.jpeg,.webp" style="display:none;">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" name="full_name" value="{{ profile.full_name }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input type="text" class="form-control" name="phone_number" value="{{ profile.phone_number }}" required>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Age</label>
            <input type="number" class="form-control" name="age" min="13" max="120" value="{{ profile.age }}" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Gender</label>
            <select class="form-select" name="gender" required>
              <option value="Male" {% if profile.gender == "Male" %}selected{% endif %}>Male</option>
              <option value="Female" {% if profile.gender == "Female" %}selected{% endif %}>Female</option>
              <option value="Other" {% if profile.gender == "Other" %}selected{% endif %}>Other</option>
              <option value="Prefer not to say" {% if profile.gender == "Prefer not to say" %}selected{% endif %}>Prefer not to say</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Favorite Genre</label>
          <select class="form-select" name="favorite_genre_id" required>
            {% for g in genres %}
              <option value="{{ g.id }}" {% if profile.favorite_genre_id == g.id %}selected{% endif %}>{{ g.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger flex-fill">Save Changes</button>
          <a href="/profile" class="btn btn-outline-light flex-fill text-center">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  document.getElementById('photoInput').addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => document.getElementById('photoPreview').src = e.target.result;
    reader.readAsDataURL(file);
  });
</script>
{% endblock %}
