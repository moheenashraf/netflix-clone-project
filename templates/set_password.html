{% extends "base.html" %}
{% block title %}Confirm Your Account{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="app-card">
      <h3 class="mb-2">Confirm Your Email</h3>
      <p style="color: #b3b3b3;">Your email is confirmed. Set a password to finish creating your account.</p>
      <form method="post" action="/set-password/{{ token }}">
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" minlength="6" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-control" name="confirm_password" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-danger w-100">Set Password & Continue</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
