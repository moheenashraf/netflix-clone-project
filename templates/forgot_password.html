{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="app-card">
      <h3 class="mb-2">Forgot Password</h3>
      <p>Enter your account email and we'll send a password reset link to it.</p>
      <form method="post" action="/forgot-password">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" required>
        </div>
        <button type="submit" class="btn btn-danger w-100">Send Reset Link</button>
      </form>
      <p class="mt-3 mb-0"><a href="/login">Back to login</a></p>
    </div>
  </div>
</div>
{% endblock %}
