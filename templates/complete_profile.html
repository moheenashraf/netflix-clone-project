{% extends "base.html" %}
{% block title %}Complete Your Profile{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="app-card">
      <h3 class="mb-2">Complete Your Profile</h3>
      <p style="color: #b3b3b3;">Just a few more details before you can browse movies.</p>
      <form method="post" action="/complete-profile" enctype="multipart/form-data">

        <div class="mb-3 text-center">
          <img id="photoPreview" src="https://placehold.co/120x120/1a1a1a/ffffff?text=Photo"
               style="width: 110px; height: 110px; object-fit: cover; border-radius: 50%; border: 2px solid #444;">
          <div class="mt-2">
            <label for="photoInput" class="btn btn-outline-light btn-sm">Upload Profile Photo</label>
            <input type="file" id="photoInput" name="profile_photo" accept=".png,.jpg,.jpeg,.webp" style="display:none;">
          </div>
          <div class="form-text" style="color: #999;">Optional. PNG, JPG, or WEBP, max 5MB.</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" name="full_name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input type="text" class="form-control" name="phone_number" required>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Age</label>
            <input type="number" class="form-control" name="age" min="13" max="120" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Gender</label>
            <select class="form-select" name="gender" required>
              <option value="">Select...</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
              <option value="Prefer not to say">Prefer not to say</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Favorite Genre</label>
          <select class="form-select" name="favorite_genre_id" required>
            <option value="">Select...</option>
            {% for g in genres %}
              <option value="{{ g.id }}">{{ g.name }}</option>
            {% endfor %}
          </select>
        </div>
        <button type="submit" class="btn btn-danger w-100">Save & Continue</button>
      </form>
    </div>
  </div>
</div>

<script>
  document.getElementById('photoInput').addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => document.getElementById('photoPreview').src = e.target.result;
    reader.readAsDataURL(file);
  });
</script>
{% endblock %}
